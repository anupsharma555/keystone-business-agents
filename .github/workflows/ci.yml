name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Python 3.11
    runs-on: ubuntu-latest
    env:
      KEYSTONE_DRY_RUN: "true"
      KEYSTONE_LIVE_MODE: "false"
      KEYSTONE_ENABLE_LIVE_GMAIL: "false"
      KEYSTONE_ENABLE_LIVE_RESEARCH: "false"
      KEYSTONE_ENABLE_LIVE_CRM: "false"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[dev]"

      - name: Run ruff
        run: .venv/bin/python -m ruff check .

      - name: Run pytest
        run: .venv/bin/python -m pytest

      - name: Run dependency audit
        run: .venv/bin/python -m pip_audit --skip-editable --progress-spinner off
