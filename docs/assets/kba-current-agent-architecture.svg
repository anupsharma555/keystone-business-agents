<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1280" viewBox="0 0 1800 1280" role="img" aria-labelledby="title desc">
  <title id="title">Keystone Business Agents current architecture</title>
  <desc id="desc">Generated architecture diagram showing entrypoints, agent-owned semantic decisions, Orchestrator-first control, request-scoped tools, bounded validation and recovery, WorkItem canonical state, optional LangGraph execution, cross-provider context, receipts, telemetry, and renderers. Representative handoffs include gmail_triage -> business_research_analyst -> outreach_composer -> approval_checkpoint; chief_of_staff -> airtable/google_workspace context -> approval_checkpoint; and rss/preprints/zotero context -> business research/opportunity specialist.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
    <marker id="arrow-det" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#d97706"/></marker>
    <marker id="arrow-tool" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0891b2"/></marker>
    <marker id="arrow-obs" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#db2777"/></marker>
    <style>
      .bg { fill: #f8fafc; }
      .frame { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .lane { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
      .orchestrator { fill: #fff7ed; stroke: #ea580c; stroke-width: 3; }
      .chief { fill: #ecfeff; stroke: #0891b2; stroke-width: 3; }
      .graph { fill: #eef2ff; stroke: #4f46e5; stroke-width: 3; }
      .specialist { fill: #ecfdf5; stroke: #16a34a; stroke-width: 2; }
      .context { fill: #f0f9ff; stroke: #0284c7; stroke-width: 2; }
      .gate { fill: #fffbeb; stroke: #d97706; stroke-width: 2; }
      .state { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2; }
      .observability { fill: #fdf2f8; stroke: #db2777; stroke-width: 2; }
      .render { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
      .title { font: 700 34px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px Arial, sans-serif; fill: #475569; }
      .section { font: 700 18px Arial, sans-serif; fill: #0f172a; }
      .cardTitle { font: 700 15px Arial, sans-serif; fill: #0f172a; }
      .body { font: 400 14px Arial, sans-serif; fill: #334155; }
      .small { font: 400 12px Arial, sans-serif; fill: #475569; }
      .tiny { font: 400 11px Arial, sans-serif; fill: #64748b; }
      .label { font: 700 12px Arial, sans-serif; fill: #334155; }
      .link { font: 700 12px Arial, sans-serif; fill: #2563eb; text-decoration: underline; }
      .routeLine { stroke: #334155; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .detLine { stroke: #d97706; stroke-width: 2.5; fill: none; marker-end: url(#arrow-det); }
      .toolAgentLine { stroke: #0891b2; stroke-width: 2.5; fill: none; marker-end: url(#arrow-tool); }
      .obsLine { stroke: #db2777; stroke-width: 2.5; fill: none; marker-end: url(#arrow-obs); }
      .dash { stroke-dasharray: 7 5; }
    </style>
  </defs>
  <rect class="bg" width="1800" height="1280"/>
  <text class="title" x="52" y="56">Keystone Business Agents Architecture</text>
  <text class="subtitle" x="54" y="84">Generated from AgentSpec, decision/tool contracts, WorkItem graph runtime, receipts, telemetry, and eval database shape.</text>
  <text class="tiny" x="1510" y="84">Generated 2026-09-18</text>
  <rect class="frame" x="40" y="115" width="1720" height="1115" rx="18"/>
<rect class="lane" x="70" y="155" width="310" height="205" rx="14"/>
<text class="section" x="95" y="190">Entrypoints</text>
<text class="body" x="95" y="222">- Slack @KNI and message actions</text>
<text class="body" x="95" y="246">- CLI ask and explicit agent mentions</text>
<text class="body" x="95" y="270">- WorkItem continue or run again</text>
<text class="body" x="95" y="294">- Scheduled automations</text>
<text class="body" x="95" y="318">- Promptfoo and Slack eval harnesses</text>
<text class="tiny" x="95" y="350">Raw request wording is preserved.</text>
<rect class="orchestrator" x="450" y="145" width="470" height="225" rx="14"/>
<text class="section" x="482" y="181">Orchestrator Agent</text>
<text class="body" x="482" y="215">- First LLM control plane for natural-language asks</text>
<text class="body" x="482" y="239">- Owns semantic route + ordered workflow choice</text>
<text class="body" x="482" y="263">- Validated internal decision reaches specialist</text>
<text class="body" x="482" y="287">- Decision + output review before rendering</text>
<text class="small" x="482" y="330">Explicit agent mention is routing advice, not authority.</text>
<text class="small" x="482" y="350">Python gates remain authoritative.</text>
<rect class="state" x="985" y="145" width="330" height="225" rx="14"/>
<text class="section" x="1010" y="181">Planning and State Contract</text>
<text class="small" x="1010" y="213">- ManualRequestPlan compatibility envelope</text>
<text class="small" x="1010" y="235">- OrchestratorResult</text>
<text class="small" x="1010" y="257">- AgentDecisionRecord + validator outcome</text>
<text class="small" x="1010" y="279">- WorkItems / SQLite canonical state</text>
<text class="small" x="1010" y="301">- Typed context packs</text>
<text class="small" x="1010" y="323">- Backend graph selection</text>
<text class="tiny" x="1010" y="357">Schema-light planning; graph-aware typed execution.</text>
<rect class="lane" x="1365" y="145" width="310" height="225" rx="14"/>
<text class="section" x="1390" y="181">Connection Legend</text>
<path class="routeLine" d="M1390 215 L1465 215"/>
<text class="body" x="1480" y="220">Routing / handoff</text>
<path class="detLine" d="M1390 252 L1465 252"/>
<text class="body" x="1480" y="257">Deterministic gate or state</text>
<path class="toolAgentLine dash" d="M1390 289 L1465 289"/>
<text class="body" x="1480" y="294">Agents as tools</text>
<path class="obsLine dash" d="M1390 326 L1465 326"/>
<text class="body" x="1480" y="331">Traces / logs / evals</text>
<text class="tiny" x="1390" y="356">Lines show ownership, not execution order.</text>
<rect class="graph" x="985" y="382" width="690" height="42" rx="10"/>
<text class="cardTitle" x="1010" y="408">Backend graph selector: single specialist step or LangGraph WorkItem graph</text>
<rect class="chief" x="450" y="430" width="470" height="245" rx="14"/>
<text class="section" x="482" y="466">KNI Chief of Staff Agent</text>
<text class="body" x="482" y="500">- Broad operating synthesis and coordination layer</text>
<text class="body" x="482" y="524">- Plans Slack, workflow, and automation work</text>
<text class="body" x="482" y="548">- Reads KNI docs, local context, Slack repo context</text>
<text class="body" x="482" y="572">- May call specialists as advisory tools</text>
<text class="body" x="482" y="596">- Selects typed cross-provider context + handoff</text>
<text class="body" x="482" y="620">- Stages review plans, approvals, and blockers</text>
<text class="small" x="482" y="642">Positioning: inside the centralized Orchestrator + WorkItem path,</text>
<text class="small" x="482" y="662">not a parallel router or alternate communication channel.</text>
<rect class="specialist" x="985" y="430" width="690" height="265" rx="14"/>
<text class="section" x="1010" y="466">Workflow Specialists</text>
<rect class="specialist" x="1010" y="490" width="150" height="78" rx="10"/>
<text class="cardTitle" x="1026" y="518">Gmail Triage</text>
<text class="small" x="1026" y="542">classify / draft</text>
<text class="small" x="1026" y="560">47 tools</text>
<rect class="specialist" x="1176" y="490" width="150" height="78" rx="10"/>
<text class="cardTitle" x="1192" y="512">Business</text>
<text class="cardTitle" x="1192" y="530">Research</text>
<text class="small" x="1192" y="548">source briefs</text>
<text class="small" x="1192" y="564">55 tools</text>
<rect class="specialist" x="1342" y="490" width="150" height="78" rx="10"/>
<text class="cardTitle" x="1358" y="512">Opportunity</text>
<text class="cardTitle" x="1358" y="530">Scout</text>
<text class="small" x="1358" y="548">score / dedupe</text>
<text class="small" x="1358" y="564">43 tools</text>
<rect class="specialist" x="1508" y="490" width="150" height="78" rx="10"/>
<text class="cardTitle" x="1524" y="512">Outreach</text>
<text class="cardTitle" x="1524" y="530">Composer</text>
<text class="small" x="1524" y="548">no-send drafts</text>
<text class="small" x="1524" y="564">60 tools</text>
<text class="body" x="1010" y="610">Each run receives raw request + validated decision + model-visible evidence.</text>
<text class="small" x="1010" y="630">Model requests are separate from actual SDK tool calls and returned outputs.</text>
<text class="tiny" x="1010" y="646">Research/Opportunity WorkItems: agent-owned SDK selection + no-reread repair.</text>
<text class="tiny" x="1010" y="660">RSS/Preprints replay tool-free; A/W/Z have missing-tool + semantic repair.</text>
<text class="tiny" x="1010" y="674">Chief nested decisions are trace-retained; supplied response is synthesis-only.</text>
<text class="tiny" x="1010" y="688">Direct actions (continue, more research, find contact, revise) reuse the dispatched path.</text>
<rect class="context" x="70" y="430" width="310" height="300" rx="14"/>
<text class="section" x="95" y="466">Read / Context Specialists</text>
<text class="body" x="95" y="500">- RAG Retrieval</text>
<text class="body" x="95" y="522">- Airtable Context</text>
<text class="body" x="95" y="544">- Google Workspace</text>
<text class="body" x="95" y="566">- Zotero Context</text>
<text class="body" x="95" y="588">- RSS Context</text>
<text class="body" x="95" y="610">- Preprints Context</text>
<text class="body" x="95" y="634">Local KNI document evidence</text>
<text class="body" x="95" y="658">Slack and automation context tools</text>
<text class="small" x="95" y="677">Context agents stage read-only</text>
<text class="small" x="95" y="692">evidence for graph handoffs.</text>
<text class="small" x="95" y="709">Provider writes stay with owning</text>
<text class="small" x="95" y="724">specialists or approved handlers.</text>
<rect class="gate" x="70" y="735" width="760" height="195" rx="14"/>
<text class="section" x="95" y="771">SDK Guardrails + Deterministic Gates</text>
<text class="body" x="95" y="805">- SDK guardrails: input/output/tool scans for PHI, secrets, send-like actions, unsafe claims</text>
<text class="body" x="95" y="830">- Python gates: request tool scope, approvals, identity, live flags, provider budgets; hard N+1 model ledger</text>
<text class="body" x="95" y="855">- Typed checks: model-visible candidates, decision coverage, schema, arithmetic, dedupe</text>
<text class="body" x="95" y="880">- Postconditions: required/optional/forbidden tool evidence; bounded correction/repair</text>
<text class="body" x="95" y="905">- Negated constraints do not steer routes: &#x27;do not scout opportunities&#x27; blocks that route</text>
<text class="small" x="95" y="924">Approval checkpoints and no-send/no-write gates remain Python-authoritative after graph steps.</text>
<rect class="context" x="870" y="735" width="805" height="195" rx="14"/>
<text class="section" x="895" y="771">Evidence, Retrieval, and Integrations</text>
<text class="body" x="895" y="805">- Search: dry-run, SearXNG, hosted web search, Exa, Tavily, Firecrawl, explicit Serper</text>
<text class="body" x="895" y="830">- Extraction: Trafilatura / Firecrawl, HTML review, rendered browser diagnostics</text>
<text class="body" x="895" y="855">- Receipts: attempts, successes, durable proof, read-back, safe retry point</text>
<text class="body" x="895" y="880">- State/context: SQLite WorkItems, artifacts, KNI docs, Slack, Gmail, Airtable, Workspace, Zotero</text>
<text class="small" x="895" y="914">Graph-produced sources can satisfy downstream offline evidence gates.</text>
<rect class="render" x="70" y="980" width="520" height="210" rx="14"/>
<text class="section" x="95" y="1016">Reviewed Output and Renderers</text>
<text class="small" x="95" y="1050">- Response synthesis produces operator-facing prose from structured outputs</text>
<text class="small" x="95" y="1073">- No-SDK draft paths ask for model reasoning or exact copy, not</text>
<text class="small" x="95" y="1096">placeholders</text>
<text class="small" x="95" y="1119">- Slack / CLI / artifact renderers own final layout</text>
<text class="small" x="95" y="1142">- Source-backed external facts stay visible in first answer</text>
<text class="small" x="95" y="1168">Raw trace noise and internal JSON stay hidden unless debugging was requested.</text>
<rect class="observability" x="635" y="980" width="1040" height="210" rx="14"/>
<text class="section" x="660" y="1016">Traces, Logs, Evals, and Feedback Loop</text>
<text class="small" x="660" y="1050">- keystone.sdk_run_summary.v1 separates model requests, actual SDK tool calls, workflow/pre-acquired/helper origins</text>
<text class="small" x="660" y="1073">- Request budget: correlation, consumed, remaining, exhaustion; rejected before N+1 model call</text>
<text class="small" x="660" y="1096">- Semantic stage rows: initial / tool correction / decision repair; transport retries stay ledger-bound</text>
<text class="small" x="660" y="1119">- Structured logs: keystone.structured_log.v1 stores redacted correlation keys only</text>
<text class="small" x="660" y="1142">- Correlated traces + eval stores: promptfoo_eval_runs, promptfoo_case_results, slack_eval_runs, human_eval_reviews, eval_trace_events,</text>
<text class="small" x="660" y="1165">benchmark SQLite</text>
<text class="small" x="660" y="1178">Promptfoo and Slack #evals exercise the same Orchestrator-first workflow path, then feed dashboards and regression tests.</text>
