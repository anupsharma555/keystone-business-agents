<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Alternative workflow: Graph or WorkItem orchestration</title>
  <desc id="desc">A deterministic graph or workflow runner owns state transitions, context packs, approval interrupts, and specialist SDK calls.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#344054"/></marker>
    <style>
      .bg{fill:#f7f9fc}.box{fill:#fff;stroke:#c8d0dc;stroke-width:2}.graph{fill:#e8f7f1;stroke:#079455;stroke-width:2}.node{fill:#eef4ff;stroke:#528bdb;stroke-width:2}.agent{fill:#fff7e6;stroke:#d89b2b;stroke-width:2}.gate{fill:#fff1f3;stroke:#d92d20;stroke-width:2}.store{fill:#f2f4f7;stroke:#667085;stroke-width:2}.h{font:700 22px Arial;fill:#101828}.b{font:400 15px Arial;fill:#344054}.s{font:400 13px Arial;fill:#475467}.t{font:700 34px Arial;fill:#101828}.line{stroke:#344054;stroke-width:2;fill:none;marker-end:url(#arrow)}.dash{stroke-dasharray:7 5}
    </style>
  </defs>
  <rect class="bg" width="1400" height="820"/>
  <text class="t" x="54" y="62">Alternative Pattern C: Deterministic Graph / WorkItem Orchestration</text>
  <text class="s" x="56" y="92">Best for durable business workflows with explicit state, approval interruptions, retries, and specialist SDK calls as nodes.</text>

  <rect class="box" x="65" y="160" width="220" height="110" rx="12"/>
  <text class="h" x="95" y="197">Request Intake</text>
  <text class="b" x="95" y="227">Slack, CLI, schedule</text>
  <text class="s" x="95" y="252">Creates or resumes case</text>

  <rect class="graph" x="395" y="115" width="325" height="470" rx="14"/>
  <text class="h" x="428" y="153">Workflow Runner / Graph</text>
  <rect class="node" x="430" y="185" width="250" height="65" rx="10"/>
  <text class="b" x="456" y="214">1. Plan route</text>
  <text class="s" x="456" y="235">manual plan + state</text>
  <rect class="node" x="430" y="275" width="250" height="65" rx="10"/>
  <text class="b" x="456" y="304">2. Build context pack</text>
  <text class="s" x="456" y="325">typed state contract</text>
  <rect class="gate" x="430" y="365" width="250" height="65" rx="10"/>
  <text class="b" x="456" y="394">3. Check gates</text>
  <text class="s" x="456" y="415">approval, source, recipient</text>
  <rect class="node" x="430" y="455" width="250" height="65" rx="10"/>
  <text class="b" x="456" y="484">4. Run specialist</text>
  <text class="s" x="456" y="505">SDK or fixture path</text>
  <path class="line" d="M555 250 L555 275"/>
  <path class="line" d="M555 340 L555 365"/>
  <path class="line" d="M555 430 L555 455"/>

  <rect class="store" x="845" y="120" width="260" height="140" rx="12"/>
  <text class="h" x="875" y="158">Durable State</text>
  <text class="b" x="875" y="190">WorkItem</text>
  <text class="b" x="875" y="215">Events, artifacts, memory</text>
  <text class="b" x="875" y="240">Approval queue</text>

  <rect class="agent" x="845" y="330" width="260" height="165" rx="12"/>
  <text class="h" x="875" y="368">Specialist SDK Agents</text>
  <text class="b" x="875" y="400">Research</text>
  <text class="b" x="875" y="425">Scout</text>
  <text class="b" x="875" y="450">Gmail</text>
  <text class="b" x="875" y="475">Outreach / Chief</text>

  <rect class="gate" x="845" y="565" width="260" height="110" rx="12"/>
  <text class="h" x="875" y="603">Interrupt / Stop</text>
  <text class="b" x="875" y="635">Needs context or approval</text>
  <text class="b" x="875" y="660">Human resumes later</text>

  <path class="line" d="M285 215 C340 215 350 215 395 215"/>
  <path class="line" d="M720 220 C770 185 795 180 845 180"/>
  <path class="line" d="M680 488 C740 410 785 405 845 405"/>
  <path class="line" d="M680 398 C760 560 785 620 845 620"/>
  <path class="line dash" d="M975 260 C910 305 780 320 680 308"/>
  <text class="s" x="745" y="290">state hydrates next node</text>
  <text class="s" x="700" y="530">blocked steps pause safely</text>
</svg>
