<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc">
  <title id="title">KNI agent routing architecture</title>
  <desc id="desc">Architecture diagram showing Slack and CLI intake, manual planner, orchestrator routing, WorkItem manager loop, specialist agents, schemas, tools, and Airtable, Google Workspace, Gmail, Slack, search, memory, and SQLite workflow boundaries.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#344054"/>
    </marker>
    <marker id="redArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#b42318"/>
    </marker>
    <style>
      .bg { fill: #f7f9fc; }
      .panel { fill: #ffffff; stroke: #c8d0dc; stroke-width: 2; }
      .lane { fill: #eef4ff; stroke: #9db7e8; stroke-width: 2; }
      .planner { fill: #e8f7f1; stroke: #69b090; stroke-width: 2; }
      .agent { fill: #fff7e6; stroke: #d89b2b; stroke-width: 2; }
      .schema { fill: #f3edff; stroke: #9e77ed; stroke-width: 2; }
      .tool { fill: #eaf8ff; stroke: #5aa9d6; stroke-width: 2; }
      .gate { fill: #fff1f3; stroke: #d92d20; stroke-width: 2; }
      .store { fill: #f2f4f7; stroke: #667085; stroke-width: 2; }
      .title { font: 700 34px Arial, sans-serif; fill: #101828; }
      .subtitle { font: 400 16px Arial, sans-serif; fill: #475467; }
      .h { font: 700 18px Arial, sans-serif; fill: #101828; }
      .body { font: 400 14px Arial, sans-serif; fill: #344054; }
      .small { font: 400 12px Arial, sans-serif; fill: #475467; }
      .tiny { font: 400 11px Arial, sans-serif; fill: #667085; }
      .label { font: 700 12px Arial, sans-serif; fill: #344054; }
      .line { stroke: #344054; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .soft { stroke: #98a2b3; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .red { stroke: #b42318; stroke-width: 2; fill: none; marker-end: url(#redArrow); }
      .dash { stroke-dasharray: 7 5; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="1080"/>
  <text class="title" x="48" y="58">KNI Agent Routing Architecture</text>
  <text class="subtitle" x="50" y="86">Planner-first interpretation, schema-light control, deterministic gates, typed tools, and Slack/Airtable/Google workflow boundaries.</text>

  <rect class="panel" x="36" y="115" width="1528" height="910" rx="14"/>

  <!-- Intake -->
  <rect class="lane" x="70" y="150" width="220" height="185" rx="12"/>
  <text class="h" x="95" y="182">Operator Intake</text>
  <text class="body" x="94" y="215">Slack @KNI mention</text>
  <text class="body" x="94" y="238">Slack message action</text>
  <text class="body" x="94" y="261">CLI keystone ask</text>
  <text class="body" x="94" y="284">Scheduled automation</text>
  <text class="small" x="94" y="315">Request text + bounded</text>
  <text class="small" x="94" y="332">Slack/thread context</text>

  <rect class="lane" x="70" y="375" width="220" height="150" rx="12"/>
  <text class="h" x="95" y="407">Slack Bridge</text>
  <text class="body" x="94" y="438">keystone-slack Socket Mode</text>
  <text class="body" x="94" y="461">business_agents_bridge.py</text>
  <text class="body" x="94" y="484">child scripts in KBA repo</text>
  <text class="small" x="94" y="510">Renderer owns Slack text</text>

  <!-- Planner -->
  <rect class="planner" x="350" y="150" width="250" height="185" rx="12"/>
  <text class="h" x="375" y="182">Manual Request Planner</text>
  <text class="body" x="374" y="215">ManualRequestPlan</text>
  <text class="body" x="374" y="238">target_agent, objective</text>
  <text class="body" x="374" y="261">target_type, constraints</text>
  <text class="body" x="374" y="284">desired_count, safety policy</text>
  <text class="small" x="374" y="315">LLM when live; heuristic fallback</text>
  <text class="small" x="374" y="332">Memo, not a deterministic lane</text>

  <rect class="planner" x="350" y="375" width="250" height="150" rx="12"/>
  <text class="h" x="375" y="407">Specialized Planners</text>
  <text class="body" x="374" y="438">OpportunitySearchPlan</text>
  <text class="body" x="374" y="461">GmailExecutionPlan</text>
  <text class="body" x="374" y="484">OutreachExecutionPlan</text>
  <text class="small" x="374" y="510">Planner guides tools; Python gates own safety</text>

  <!-- Control plane -->
  <rect class="panel" x="660" y="150" width="310" height="375" rx="12"/>
  <text class="h" x="690" y="182">Control Plane</text>

  <rect class="agent" x="690" y="205" width="250" height="95" rx="10"/>
  <text class="h" x="712" y="235">Orchestrator</text>
  <text class="body" x="712" y="260">Route, review, state check</text>
  <text class="small" x="712" y="283">OrchestratorResult + review schema</text>

  <rect class="agent" x="690" y="320" width="250" height="85" rx="10"/>
  <text class="h" x="712" y="350">WorkItem Manager Loop</text>
  <text class="body" x="712" y="375">Route, gather context, run specialist</text>
  <text class="small" x="712" y="398">Review + optional deepen/repair</text>

  <rect class="gate" x="690" y="425" width="250" height="78" rx="10"/>
  <text class="h" x="712" y="454">Authoritative Gates</text>
  <text class="body" x="712" y="477">No-send, approval, PHI, source,</text>
  <text class="body" x="712" y="496">recipient, identity, arithmetic</text>

  <!-- Agents -->
  <rect class="agent" x="1030" y="135" width="460" height="390" rx="12"/>
  <text class="h" x="1058" y="166">Registered SDK Agents</text>
  <text class="small" x="1058" y="190">AgentSpec registry + build_*_agent + markdown instructions + output schema + declared tools</text>

  <rect class="agent" x="1060" y="215" width="190" height="70" rx="10"/>
  <text class="h" x="1080" y="243">Chief of Staff</text>
  <text class="small" x="1080" y="265">Slack ops, internal review writes</text>

  <rect class="agent" x="1270" y="215" width="190" height="70" rx="10"/>
  <text class="h" x="1290" y="243">Business Research</text>
  <text class="small" x="1290" y="265">Source-backed briefs</text>

  <rect class="agent" x="1060" y="305" width="190" height="70" rx="10"/>
  <text class="h" x="1080" y="333">Opportunity Scout</text>
  <text class="small" x="1080" y="355">Discovery, scoring, handoff</text>

  <rect class="agent" x="1270" y="305" width="190" height="70" rx="10"/>
  <text class="h" x="1290" y="333">Gmail Triage</text>
  <text class="small" x="1290" y="355">Read, classify, draft-only</text>

  <rect class="agent" x="1165" y="395" width="190" height="70" rx="10"/>
  <text class="h" x="1185" y="423">Outreach Composer</text>
  <text class="small" x="1185" y="445">Approved context only</text>

  <text class="small" x="1058" y="498">Specialists can be called directly, through Orchestrator, or by WorkItem context packs.</text>

  <!-- Schemas and instructions -->
  <rect class="schema" x="70" y="585" width="330" height="255" rx="12"/>
  <text class="h" x="96" y="617">Schema Contracts</text>
  <text class="body" x="95" y="650">ManualRequestPlan</text>
  <text class="body" x="95" y="673">OrchestratorResult, ChiefOfStaffResult</text>
  <text class="body" x="95" y="696">ResearchBrief, OpportunityScoutResult</text>
  <text class="body" x="95" y="719">EmailTriageResult, OutreachDraft</text>
  <text class="body" x="95" y="742">WorkItem, artifact refs, approval gates</text>
  <text class="body" x="95" y="765">Context packs: Research, Opportunity,</text>
  <text class="body" x="95" y="788">Outreach, Gmail</text>
  <text class="small" x="95" y="820">Schemas stay stable; reasoning stays in prompts,</text>
  <text class="small" x="95" y="837">audit notes, decision trace, and WorkItem events.</text>

  <rect class="schema" x="435" y="585" width="275" height="255" rx="12"/>
  <text class="h" x="462" y="617">Instruction Layer</text>
  <text class="body" x="462" y="650">keystone_profile.md</text>
  <text class="body" x="462" y="673">safety_policy.md</text>
  <text class="body" x="462" y="696">writing_style.md</text>
  <text class="body" x="462" y="719">agent-specific prompts</text>
  <text class="body" x="462" y="742">manual_request_planner.md</text>
  <text class="body" x="462" y="765">slack-posting-rules.md</text>
  <text class="small" x="462" y="820">Prompts choose capabilities from task shape,</text>
  <text class="small" x="462" y="837">not broad phrase taxonomies.</text>

  <!-- Tools -->
  <rect class="tool" x="750" y="585" width="360" height="360" rx="12"/>
  <text class="h" x="778" y="617">Typed Tool Boundaries</text>
  <text class="body" x="778" y="650">SearchProvider: SearXNG, Agents web search,</text>
  <text class="body" x="778" y="673">Serper, Firecrawl, Tavily, dry-run</text>
  <text class="body" x="778" y="704">Airtable: schema first, scoped read/write</text>
  <text class="body" x="778" y="727">Google: Drive, Docs, Sheets in KNIOps</text>
  <text class="body" x="778" y="758">Gmail: read, labels, draft creation only</text>
  <text class="body" x="778" y="781">Slack ops: config, repo context, summaries</text>
  <text class="body" x="778" y="812">Memory/local context/file search</text>
  <text class="body" x="778" y="835">Browser diagnostics: read-only backend checks</text>
  <text class="small" x="778" y="885">Tool modules own provider APIs and credentials.</text>
  <text class="small" x="778" y="902">Agents compose tools through declared policies.</text>

  <!-- External surfaces -->
  <rect class="store" x="1160" y="585" width="330" height="360" rx="12"/>
  <text class="h" x="1188" y="617">Workflow Surfaces</text>
  <text class="body" x="1188" y="650">Slack: request, status, review cards,</text>
  <text class="body" x="1188" y="673">bounded history context</text>
  <text class="body" x="1188" y="704">SQLite: WorkItems, artifacts, approvals,</text>
  <text class="body" x="1188" y="727">events, feedback, memory</text>
  <text class="body" x="1188" y="758">Airtable: table/schema records</text>
  <text class="body" x="1188" y="781">Google Workspace: internal docs/sheets</text>
  <text class="body" x="1188" y="812">Gmail: draft-only outbound boundary</text>
  <text class="body" x="1188" y="835">Search/web extraction: source evidence</text>
  <text class="small" x="1188" y="885">Live side effects require explicit flags,</text>
  <text class="small" x="1188" y="902">credentials, approval refs, and renderer gates.</text>

  <!-- Flow arrows -->
  <path class="line" d="M290 240 C320 240 320 240 350 240"/>
  <text class="label" x="307" y="228">request</text>

  <path class="line" d="M290 450 C320 450 320 450 350 450"/>
  <text class="label" x="304" y="438">child run</text>

  <path class="line" d="M600 240 C635 240 635 245 690 252"/>
  <text class="label" x="612" y="224">plan memo</text>

  <path class="line" d="M600 450 C640 450 640 362 690 362"/>
  <text class="label" x="608" y="428">execution plans</text>

  <path class="line" d="M940 252 C980 252 990 250 1030 250"/>
  <text class="label" x="966" y="235">handoff</text>

  <path class="line" d="M940 362 C980 362 990 355 1030 342"/>
  <text class="label" x="958" y="383">specialist step</text>

  <path class="red" d="M815 425 L815 405"/>
  <text class="label" x="830" y="418">gates override model</text>

  <path class="soft dash" d="M1030 500 C930 548 840 565 710 610"/>
  <text class="label" x="845" y="548">structured outputs</text>

  <path class="soft dash" d="M1030 472 C900 500 650 540 400 610"/>
  <text class="label" x="682" y="520">schemas and instructions</text>

  <path class="line" d="M1260 525 C1225 560 1160 650 1110 715"/>
  <text class="label" x="1145" y="622">tool calls</text>

  <path class="line" d="M1110 760 C1135 760 1135 760 1160 760"/>
  <text class="label" x="1118" y="748">provider IO</text>

  <path class="soft dash" d="M1325 585 C1325 548 1325 535 1325 525"/>
  <text class="label" x="1340" y="560">results render</text>

  <path class="line" d="M1160 650 C1015 545 1005 465 940 464"/>
  <text class="label" x="1010" y="568">state + approvals</text>

  <path class="line" d="M970 464 C1005 464 1005 430 1165 430"/>
  <text class="label" x="1000" y="445">approved context</text>

  <path class="line" d="M180 335 L180 375"/>
  <text class="label" x="195" y="358">Slack runtime</text>

  <!-- Footer notes -->
  <rect class="gate" x="70" y="885" width="640" height="90" rx="12"/>
  <text class="h" x="96" y="918">Planner-First Shortcut Rule</text>
  <text class="body" x="96" y="944">Live/direct agent requests get planner interpretation before deterministic helpers claim a route.</text>
  <text class="body" x="96" y="967">Deterministic code may proceed only for safety, exact arithmetic, record identity, approvals, and bounded tool execution.</text>

  <rect class="planner" x="750" y="975" width="740" height="0" rx="0"/>
  <text class="tiny" x="750" y="990">Reviewed surfaces: AGENTS.md, README, AgentSpec registry, tool policy, prompts, schemas, SDK/run wrappers, WorkItem runner, retrieval layer, internal data tools, Slack docs, Slack bridge, and Slack action contract.</text>
</svg>
