<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Keystone Web Search Provider Architecture</title>
  <desc id="desc">Diagram showing Keystone business agents using primary discovery, capped deepening, selected-page extraction, provider diagnostics, and Friday usage monitoring.</desc>
  <defs>
    <style>
      .bg { fill: #f7f8fb; }
      .panel { fill: #ffffff; stroke: #c8d0df; stroke-width: 2; rx: 8; }
      .agent { fill: #eef6ff; stroke: #6d91c7; stroke-width: 2; rx: 8; }
      .policy { fill: #fff7e6; stroke: #d69b2d; stroke-width: 2; rx: 8; }
      .primary { fill: #edf8f0; stroke: #5a9e70; stroke-width: 2; rx: 8; }
      .deep { fill: #f1efff; stroke: #8878d8; stroke-width: 2; rx: 8; }
      .extract { fill: #fef1f1; stroke: #ca6d6d; stroke-width: 2; rx: 8; }
      .disabled { fill: #f2f3f5; stroke: #8a93a3; stroke-width: 2; stroke-dasharray: 8 6; rx: 8; }
      .output { fill: #eaf7f7; stroke: #4e9b9b; stroke-width: 2; rx: 8; }
      .title { font: 700 28px Arial, sans-serif; fill: #172033; }
      .section { font: 700 21px Arial, sans-serif; fill: #172033; }
      .label { font: 700 18px Arial, sans-serif; fill: #172033; }
      .small { font: 15px Arial, sans-serif; fill: #344055; }
      .tiny { font: 13px Arial, sans-serif; fill: #546077; }
      .note { font: 14px Arial, sans-serif; fill: #697386; }
      .arrow { stroke: #526078; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #7b8496; stroke-width: 2.5; fill: none; stroke-dasharray: 8 6; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#526078" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="980" />
  <text class="title" x="70" y="58">Keystone Web Search: Primary Lanes, Deepening, Extraction</text>
  <text class="note" x="70" y="88">Agents call one shared search tool. Python retrieval policy chooses provider lanes, records diagnostics, and preserves dry-run and credit limits.</text>

  <rect class="panel" x="60" y="125" width="310" height="280" />
  <text class="section" x="88" y="160">All Search-Capable Agents</text>
  <rect class="agent" x="88" y="188" width="250" height="44" />
  <text class="label" x="110" y="216">Chief of Staff</text>
  <rect class="agent" x="88" y="246" width="250" height="44" />
  <text class="label" x="110" y="274">Business Research</text>
  <rect class="agent" x="88" y="304" width="250" height="44" />
  <text class="label" x="110" y="332">Opportunity Scout</text>
  <rect class="agent" x="88" y="362" width="250" height="28" />
  <text class="small" x="110" y="382">Gmail, Outreach, Orchestrator</text>

  <rect class="policy" x="430" y="136" width="330" height="252" />
  <text class="section" x="460" y="172">Shared Retrieval Policy</text>
  <text class="small" x="460" y="205">One `search_web` tool contract</text>
  <text class="small" x="460" y="233">Dry-run unless live-enabled</text>
  <text class="small" x="460" y="261">Quality gate after first pass</text>
  <text class="small" x="460" y="289">Explicit deeper-search prompts</text>
  <text class="small" x="460" y="317">force capped deepening lanes</text>
  <text class="tiny" x="460" y="351">Serper disabled until credits return</text>

  <rect class="panel" x="825" y="105" width="705" height="355" />
  <text class="section" x="855" y="142">Primary Discovery Lanes</text>
  <rect class="primary" x="855" y="170" width="195" height="76" />
  <text class="label" x="880" y="202">SearXNG</text>
  <text class="tiny" x="880" y="226">broad local recall</text>
  <rect class="primary" x="1072" y="170" width="205" height="76" />
  <text class="label" x="1096" y="202">Agents Web Search</text>
  <text class="tiny" x="1096" y="226">hosted capped lane</text>
  <rect class="deep" x="1298" y="170" width="195" height="76" />
  <text class="label" x="1323" y="202">Exa</text>
  <text class="tiny" x="1323" y="226">semantic precision</text>

  <text class="section" x="855" y="286">Deepening Lanes</text>
  <rect class="deep" x="855" y="314" width="262" height="82" />
  <text class="label" x="882" y="346">Exa</text>
  <text class="tiny" x="882" y="370">default capped semantic deepening</text>
  <rect class="deep" x="1143" y="314" width="262" height="82" />
  <text class="label" x="1170" y="346">Tavily</text>
  <text class="tiny" x="1170" y="370">deeper research and breadth lane</text>
  <rect class="disabled" x="1430" y="314" width="63" height="82" />
  <text class="tiny" x="1443" y="350">Serper</text>
  <text class="tiny" x="1444" y="372">off</text>
  <text class="tiny" x="855" y="430">Exa/Tavily caps default to 2 calls per run. Explicit provider-comparison prompts attempt both when configured.</text>

  <rect class="panel" x="60" y="485" width="700" height="238" />
  <text class="section" x="90" y="522">Secondary Extraction Layer</text>
  <rect class="extract" x="90" y="552" width="200" height="72" />
  <text class="label" x="118" y="583">Trafilatura</text>
  <text class="tiny" x="118" y="606">default local extraction</text>
  <rect class="extract" x="320" y="552" width="200" height="72" />
  <text class="label" x="348" y="583">Firecrawl</text>
  <text class="tiny" x="348" y="606">configured paid fallback</text>
  <rect class="extract" x="550" y="552" width="180" height="72" />
  <text class="label" x="578" y="583">Crawl4AI</text>
  <text class="tiny" x="578" y="606">local/heavier fallback</text>
  <text class="small" x="90" y="664">Extraction reads selected URLs after discovery.</text>
  <text class="small" x="90" y="692">It does not replace primary search or perform browser-side writes.</text>

  <rect class="panel" x="825" y="500" width="705" height="223" />
  <text class="section" x="855" y="536">Diagnostics And Outputs</text>
  <rect class="output" x="855" y="566" width="300" height="82" />
  <text class="label" x="884" y="598">Slack Metadata</text>
  <text class="tiny" x="884" y="621">query, top URLs, lane status, usage, errors</text>
  <rect class="output" x="1185" y="566" width="308" height="82" />
  <text class="label" x="1214" y="598">Source Bundle</text>
  <text class="tiny" x="1214" y="621">deduped URLs, claims, source quality</text>
  <rect class="output" x="1016" y="672" width="318" height="40" />
  <text class="label" x="1044" y="699">Source-backed answer</text>

  <rect class="panel" x="60" y="780" width="1468" height="125" />
  <text class="section" x="90" y="816">Friday API Usage Automation</text>
  <text class="small" x="90" y="850">Tracks OpenAI, Tavily, Exa, Apify, Firecrawl, Browserless, and Google Cloud snapshots.</text>
  <text class="small" x="90" y="878">Exa uses `EXA_SERVICE_API_KEY` plus `EXA_API_KEY_ID` or `EXA_API_KEY_NAME=default` and estimates free-tier remaining credits.</text>
  <text class="small" x="90" y="906">SearXNG, Trafilatura, and Crawl4AI are reported as open-source/local providers rather than paid API lanes.</text>

  <path class="arrow" d="M370 262 C392 262 410 262 430 262" />
  <path class="arrow" d="M760 262 C788 262 806 262 825 262" />
  <path class="arrow" d="M1175 460 L1175 500" />
  <path class="arrow" d="M410 485 L520 388" />
  <path class="arrow" d="M760 604 C790 604 810 604 825 604" />
  <path class="arrow" d="M1155 607 C1165 607 1175 607 1185 607" />
  <path class="arrow" d="M1334 648 L1215 672" />
  <path class="dash" d="M1175 723 L1175 780" />
</svg>
