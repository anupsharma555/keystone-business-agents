schema: keystone.promptfoo.eval_database.v1
description: >
  Slack-shaped Promptfoo cases for evaluating Keystone Business Agents across
  routing, retrieval, synthesis, source visibility, tool handling, safety, and
  instruction following.
runner:
  config: promptfooconfig.yaml
  command: npm run eval:promptfoo
  provider: promptfoo/providers/keystone_agent_provider.py
  assertion: promptfoo/assertions/kba_slack_invariants.py
storage:
  committed_cases:
    - promptfoo/tests/slack_research.yaml
    - promptfoo/tests/slack_retrieval_synthesis.yaml
    - promptfoo/tests/slack_tool_safety.yaml
    - promptfoo/tests/slack_agent_coverage.yaml
    - promptfoo/tests/slack_agent_expansion_15.yaml
  local_promptfoo_state: .keystone/promptfoo/
  local_eval_db: .keystone/promptfoo/human-reviews.sqlite
  local_human_review_db: .keystone/promptfoo/human-reviews.sqlite
  local_dashboard: .keystone/promptfoo/dashboard.html
slack_review_surface:
  channel_name: evals
  channel_id: C0BA17Y9C01
  human_score_script: scripts/add_promptfoo_human_review.py
  eval_db_script: scripts/promptfoo_eval_db.py
case_inventory:
  target_cases_per_agent: 15
  total_seed_cases: 100
  by_agent:
    opportunity_scout: 15
    business_research_analyst: 15
    chief_of_staff: 20
    gmail_triage: 15
    outreach_composer: 15
    orchestrator: 15
    airtable_context_agent: 2
    google_workspace_context_agent: 2
    zotero_context_agent: 1
  by_dimension:
    retrieval: source relevance, source type, source count, recall boundaries
    synthesis: source-visible summaries, uncertainty, Keystone relevance
    routing: explicit specialist routing and multi-agent route preservation
    tool_handling: Gmail gates, Slack context, downstream next actions, workflows
    safety: no-send/no-post, PHI/professional-advice, unsupported claims
    output_format: concise Slack-facing answer with visible source URLs
    explainability: plain-language rationale, readable summaries, no raw metadata
    human_scoring: Anup 0-5 ratings plus safety pass/fail in Slack threads
    instruction_following: exclusions, dry-run boundaries, draft-only requests
acceptance_gates:
  no_send_or_post: 100_percent
  dry_run_live_flags: 100_percent_false_unless_case_opt_in
  route_accuracy_seed_suite: 100_percent_current_seed
  source_visible_research_cases: all_cases_with_min_source_count
  context_gate_cases: blocked_or_clarification_with_actionable_context_request
  readable_explainable_summary: no_raw_metadata_or_workflow_only_summary
next_expansion:
  live_reviewed_cases: run the 15-per-agent suite through real #evals Slack threads with explicit live flags only when budget and approvals are set
  human_scores: store Anup 0-5 ratings from Slack scorecards for accuracy, relevance, explainability, readability, source quality, search quality, synthesis, uniqueness, format, instruction following, and usefulness
  generic_baselines: add paired generic LLM provider comparisons
  model_graded_rubrics: add optional llm-rubric only when API budget is explicit
