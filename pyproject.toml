[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "keystone-business-agents"
version = "0.1.0"
description = "OpenAI Agents SDK business agents for Keystone Neuroinformatics LLC"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.13.4",
  "fastapi>=0.136.3",
  "google-api-python-client>=2.187.0",
  "google-auth>=2.43.0",
  "idna>=3.15",
  "openai-agents>=0.14.5",
  "orjson>=3.11.6",
  "pydantic>=2.7,<3",
  "PyJWT>=2.12.0",
  "python-dotenv>=1.2.2",
  "python-multipart>=0.0.27",
  "requests",
  "rich",
  "starlette>=1.0.1",
  "trafilatura>=2.0,<3",
  "urllib3>=2.7.0",
]

[project.scripts]
keystone = "keystone_agents.cli:main"

[project.optional-dependencies]
dev = [
  "coverage[toml]",
  "pip-audit",
  "pytest>=8.0",
  "ruff",
]
orchestration = [
  "langgraph>=1.0,<2",
]
browser = [
  "playwright>=1.56.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
keystone_agents = [
  "pricing/*.json",
  "prompts/*.md",
  "skills/*/SKILL.md",
  "templates/outreach/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["keystone_agents"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 77
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["artifacts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"scripts/compare_agent_run_costs.py" = ["E501"]
"src/keystone_agents/agents/chief_of_staff.py" = ["E501"]
"src/keystone_agents/context_sources.py" = ["E501"]
"src/keystone_agents/cost_experiments.py" = ["E501"]
"src/keystone_agents/response_synthesis.py" = ["E501"]
"src/keystone_agents/workflow_runner.py" = ["E501"]
"src/keystone_agents/multi_agent_automations.py" = ["E501"]
"tests/test_chief_of_staff.py" = ["E501"]
"tests/test_live_retrieval_integration.py" = ["E501"]
"tests/test_manual_request_plan.py" = ["E501"]
"tests/test_orchestrator.py" = ["E501"]
"tests/test_prompt_contracts.py" = ["E501"]
"tests/test_response_synthesis.py" = ["E501"]
"tests/test_multi_agent_automations.py" = ["E501"]
"tests/test_workflow_runner.py" = ["E501"]
