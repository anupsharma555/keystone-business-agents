[build-system]
requires = ["setuptools>=83", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "keystone-business-agents"
version = "0.1.0"
description = "OpenAI Agents SDK business agents for Keystone Neuroinformatics LLC"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.13.4",
  "fastapi>=0.136.3",
  "google-api-python-client>=2.187.0",
  "google-auth>=2.43.0",
  "idna>=3.15",
  "openai-agents>=0.14.5",
  "orjson>=3.11.6",
  "pydantic>=2.7,<3",
  "pypdf>=6.0,<7",
  "PyJWT>=2.12.0",
  "python-dotenv>=1.2.2",
  "python-multipart>=0.0.27",
  "requests",
  "rich",
  "starlette>=1.0.1",
  "trafilatura>=2.0,<3",
  "urllib3>=2.7.0",
]

[project.scripts]
keystone = "keystone_agents.cli:main"

[project.optional-dependencies]
dev = [
  "coverage[toml]",
  "pip-audit",
  "PyYAML>=6.0.3,<7",
  "pytest>=8.0",
  "ruff",
  "setuptools>=83",
]
orchestration = [
  "langgraph>=1.0,<2",
]
browser = [
  "playwright>=1.56.0",
]
extraction = [
  "crawl4ai>=0.9.1,<0.10",
  "cryptography>=46,<49",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
keystone_agents = [
  "pricing/*.json",
  "prompts/*.md",
  "skills/*/SKILL.md",
  "templates/outreach/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["keystone_agents"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 77
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["artifacts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
